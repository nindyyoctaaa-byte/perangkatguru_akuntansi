<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkunKu - Belajar Akuntansi</title>
<meta name="description" content="Belajar akuntansi dengan materi singkat, kuis, dan umpan balik instan.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#16A34A;--g-d:#15803D;--g-l:#DCFCE7;--p:#FBCFE8;--p-l:#FDF2F8;--ink:#14231A;--mute:#5F6F66;--bad:#E11D48;--bad-l:#FFE4EA;--bg:#FFFDFE;--card:#FFFFFF;--line:#F3C6DD}
@media(prefers-color-scheme:dark){:root{--ink:#EDF6F0;--mute:#9DB0A5;--bg:#0F1A14;--card:#17261D;--p-l:#2A1B25;--p:#5B2D45;--g-l:#133524;--bad-l:#3B1620;--line:#4A2C3D}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font-family:Nunito,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--p);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;color:var(--g);cursor:pointer;border:0;background:none;font-family:inherit}
.logo span{color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:28px;line-height:1.2;margin:8px 0 8px;font-weight:800}
h2{font-size:21px;margin:0 0 8px;font-weight:800}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px}
.btn:hover{background:var(--g-d)}
.btn.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.grid{display:grid;gap:12px}
.mapel{background:var(--p-l);border:2px solid var(--p);border-radius:16px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.mapel:hover{border-color:var(--g)}
.mapel[disabled]{opacity:.6;cursor:default}
.mapel b{display:block;font-size:18px}
.tag{display:inline-block;font-size:13px;font-weight:800;background:var(--g-l);color:var(--g-d);border-radius:20px;padding:2px 10px;margin-top:6px}
.tag.off{background:var(--p);color:var(--ink)}
.bar{height:10px;background:var(--p);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.back{background:none;border:0;color:var(--g);font:800 15px Nunito,sans-serif;cursor:pointer;padding:8px 0}
.babrow{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--p);border-radius:14px;padding:14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.babrow:hover{border-color:var(--g)}
.babrow .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:800}
.babrow.done .n{background:var(--g);color:#fff}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;padding:10px;border-radius:12px;border:2px solid var(--p);background:var(--card);font:800 15px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.ledger{background:var(--p-l) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border:2px solid var(--p);border-left:6px solid var(--g);border-radius:14px;padding:18px 18px 8px;margin:12px 0}
.ledger h2{background:var(--p-l);display:inline-block;padding-right:8px}
.ledger p,.ledger li{line-height:32px;margin:0}
.ledger ul{margin:0 0 12px;padding-left:20px}
.ex{background:var(--g-l);border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.6;font-size:15px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--p);border-radius:12px;padding:12px 14px;margin:8px 0;font:600 16px Nunito,sans-serif;color:var(--ink);cursor:pointer;min-height:44px}
.opt:hover:not([disabled]){border-color:var(--g)}
.opt.ok{background:var(--g-l);border-color:var(--g)}
.opt.no{background:var(--bad-l);border-color:var(--bad)}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--g-l)}.fb.no{background:var(--bad-l)}
.score{font-size:56px;font-weight:800;color:var(--g);line-height:1}
footer{text-align:center;color:var(--mute);font-size:13px;padding:16px}
.role{display:flex;background:var(--p);border-radius:20px;padding:3px}
.role button{border:0;background:none;padding:6px 14px;border-radius:16px;font:800 14px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.role button.on{background:var(--g);color:#fff}
.fl{display:block;font-weight:800;font-size:14px;margin:12px 0}
.fl input,.fl textarea,.fl select,.q{display:block;width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--p);border-radius:10px;font:400 16px Nunito,sans-serif;background:var(--card);color:var(--ink)}
.paper{background:#fff;color:#000;border:2px solid var(--p);border-radius:8px;padding:16px;overflow-x:auto;font-size:14px;line-height:1.5}
@media print{header,footer,.noprint{display:none!important}.paper{border:0;padding:0}body{background:#fff}}
@media(min-width:600px){.grid.two{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===== PROGRESS (disimpan di browser) ===== */
function load(){try{return JSON.parse(localStorage.getItem('akunku')||'{}')}catch(e){return{}}}
function save(p){try{localStorage.setItem('akunku',JSON.stringify(p))}catch(e){}}
function pr(id){return load()[id]||{}}
function setPr(id,v){var p=load();p[id]=Object.assign(p[id]||{},v);save(p);syncPr(id)}
function subjPct(s){if(!s.bab.length)return 0;var n=0;s.bab.forEach(function(b){var r=pr(b.id);if(r.materi)n+=1/3;if(r.video)n+=1/3;if(r.lulus)n+=1/3});return Math.round(n/s.bab.length*100)}
/* ===== STATE & RENDER ===== */
var S={v:'home'},$=document.getElementById('app');
function go(v,o){S=Object.assign({v:v},o||{});render();window.scrollTo(0,0)}
function find(id){return DATA.filter(function(s){return s.id===id})[0]}
function bar(p){return '<div class="bar" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'}
function render(){
 var h='';
 if(S.v==='home'){
  h='<h1>Belajar akuntansi, selangkah demi selangkah</h1><p class="mute">Materi singkat, kuis dengan jawaban langsung, dan progres yang terlihat. Pilih mata pelajaran untuk mulai.</p><div class="grid two">';
  DATA.forEach(function(s,i){var p=subjPct(s);
   h+='<button class="mapel" '+(s.aktif?'onclick="go(\'subj\',{s:\''+s.id+'\'})"':'disabled')+'><span style="font-size:28px">'+s.ikon+'</span><b>'+s.nama+'</b><span class="mute">'+s.desk+'</span>'+(s.aktif?(i===0&&!p?'<span class="tag">Mulai dari sini</span>':bar(p)+'<span class="mute">Progres '+p+'%</span>'):'<span class="tag off">Segera hadir</span>')+'</button>'});
  h+='</div>';
 }
 if(S.v==='subj'){var s=find(S.s);
  h='<button class="back" onclick="go(\'home\')">Kembali</button><h1>'+s.nama+'</h1>'+bar(subjPct(s))+'<p class="mute" style="margin-top:6px">Progres '+subjPct(s)+'%</p><div class="grid">';
  s.bab.forEach(function(b,i){var r=pr(b.id);

 return a.length?a.map(function(x){return '<div class="mapel" style="cursor:default"><b>'+esc(x.title)+'</b><span class="mute">'+TPL[x.type].nama+', '+esc(x.d.fase||'fase belum diisi')+', diperbarui '+new Date(x.at).toLocaleDateString('id-ID')+'</span><div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+(mine(x)?'<button class="btn ghost" onclick="openDoc(\''+x.id+'\')">Edit</button>':'')+'<button class="btn ghost" onclick="prevDoc(\''+x.id+'\')">Pratinjau</button>'+(mine(x)?'<button class="btn ghost" onclick="delDoc(\''+x.id+'\')">Hapus</button>':'')+'</div></div>'}).join(''):'<p class="mute">Belum ada dokumen yang cocok. Klik Buat ATP atau Buat Modul Ajar untuk memulai.</p>'}

 if(S.v==='auth')return authH();

 var d=S.doc,T=TPL[d.type],h='<button class="back" onclick="go(\'hub\')">Kembali</button><h1>'+T.nama+'</h1><button class="btn ghost" onclick="sample()">Isi contoh Bab 1</button>';
 T.f.forEach(function(f){h+=fld(f,d.d[f[0]])});

  h+='<button class="btn ghost" style="margin-top:12px" onclick="S.doc.rows.push([\'\',\'\',\'\',\'\',\'\']);render()">Tambah baris</button>'}

function docH(d){var T=TPL[d.type],b=function(s){return esc(s).replace(/\n/g,'<br>')},tb='<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">',
